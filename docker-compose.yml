services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: futebol
      POSTGRES_PASSWORD: futebol
      POSTGRES_DB: futebol
    ports:
      - "5432:5432"
    volumes:
      - futebol_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futebol"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  futebol_db_data:
